name: Build mod from zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::В корне репозитория нет .zip файла"
            exit 1
          fi
          echo "Распаковываю: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          GRADLE_FILE=$(find _src -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::В архиве не найден build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Patch drag-and-drop method
        run: |
          python3 - <<'PYEOF'
          import glob
          p = glob.glob("_src/**/ImageBuilderScreen.java", recursive=True)[0]
          s = open(p, encoding="utf-8").read()
          old = "\t@Override\n\tpublic void filesDragged(List<Path> paths) {\n\t\tfor (Path p : paths) {"
          new = "\tpublic void onFilesDropped(List<Path> paths) {\n\t\thandleDroppedFiles(paths);\n\t}\n\n\tpublic void filesDragged(List<Path> paths) {\n\t\thandleDroppedFiles(paths);\n\t}\n\n\tprivate void handleDroppedFiles(List<Path> paths) {\n\t\tfor (Path p : paths) {"
          if old in s:
              open(p, "w", encoding="utf-8").write(s.replace(old, new))
              print("patched")
          else:
              print("already fixed or not found")
          PYEOF

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: imagebuilder-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
